<style>
:root{--ink:#2A2420;--soft:#7A6E64;--bg:#F1ECE0;--teal:#2A140B;--accent:#C2674A}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Lexend,"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:19px;line-height:1.6;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
.box{background:#FFFCF7;border:1px solid #E8DFD2;box-shadow:0 10px 30px rgba(42,36,32,.06);border-radius:24px;padding:28px 24px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:16px;text-align:center}
.box img{width:96px;height:96px;border-radius:22px;align-self:center}
h1{margin:0;font-size:44px;font-family:"Cherry Bomb One",Georgia,serif;font-weight:400}
.rx{width:96px;height:96px;border-radius:22px;overflow:hidden;align-self:center;display:grid;grid-template-columns:1fr 1fr}.rx span{display:flex;align-items:center;justify-content:center;font:36px "Cherry Bomb One",Georgia,serif}.rx span:nth-child(1){background:#F1ECE0;color:#4A2414}.rx span:nth-child(2){background:#5A2E18;color:#D9E8E6}.rx span:nth-child(3){background:#A3A03C;color:#F1ECE0}.rx span:nth-child(4){background:#D9E8E6;color:#8C7518}
p{margin:0;color:var(--soft);font-size:17px}
input[type=password]{font:inherit;font-size:20px;padding:14px 16px;border:1px solid #DCCFBE;background:#fff;border-radius:14px;width:100%}
input[type=password]:focus{outline:3px solid var(--teal);outline-offset:1px}
label.rem{display:flex;align-items:center;gap:10px;justify-content:center;font-size:17px}
label.rem input{width:24px;height:24px;accent-color:var(--teal)}
button{font:inherit;font-weight:700;font-size:20px;background:var(--teal);color:#fff;border:0;border-radius:14px;padding:14px}
#err{color:#c0392b;font-weight:700;min-height:1.6em}
</style>
</head>

async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.salt),iterations:D.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const out=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.iv)},key,u(D.ct));
  return new TextDecoder().decode(out);
}
async function openTrip(pw,remember){
  try{
    const html=await unlock(pw);
    try{ if(remember) localStorage.setItem(KEY,pw); else localStorage.removeItem(KEY); }catch(e){}
    document.open();document.write(html);document.close();
    return true;
  }catch(e){return false}
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const err=document.getElementById('err');err.textContent='Opening...';
  const ok=await openTrip(document.getElementById('pw').value,document.getElementById('rem').checked);
  if(!ok) err.textContent='That password did not work. Try again.';
});
(async()=>{let s=null;try{s=localStorage.getItem(KEY)}catch(e){}
  if(s){const ok=await openTrip(s,true);if(!ok){try{localStorage.removeItem(KEY)}catch(e){}}}})();
</script>
